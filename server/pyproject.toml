[project]
name = "app"
version = "1.0.0"
description = "Server that works as a RAG knowledge inbox built with FastAPI, where embedding is handled by Jina AI embeddings, and chat is handled by NVIDIA NIM"
authors = [
    { name = "riyazuddin-1", email = "md.riyazuddin.dev@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.163.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "openai>=3.55.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
    "tenacity>=9.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
